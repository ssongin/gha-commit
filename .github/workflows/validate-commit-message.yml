name: Validate commit message

on:
  workflow_call:
    inputs:
      commit_message:
        description: Commit message to validate; defaults to the current push commit or pull request head
        required: false
        default: ''
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Extract commit message
        if: inputs.commit_message == ''
        id: extract
        uses: ssongin/gha-commit/.github/actions/extract-last-commit-message@master
      - name: Check Conventional Commits header
        env:
          COMMIT_MESSAGE: ${{ inputs.commit_message || steps.extract.outputs.message }}
        shell: bash
        run: |
          header="${COMMIT_MESSAGE%%$'\n'*}"
          pattern='^(epic|major|feat|fix|build|chore|perf|refactor|revert|style|cicd|docs|test)(\([^)]+\))?!?: .+$'
          if [[ ! "$header" =~ $pattern ]]; then
            echo "::error::Commit message must use an allowed type and Conventional Commits header format: <type>[optional scope][!]: <description>"
            exit 1
          fi
